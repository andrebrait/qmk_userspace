name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      # Pin the OS-detection contribution (qmk/qmk_firmware#26516 and #26503) until it lands upstream.
      qmk_repo: andrebrait/qmk_firmware
      qmk_ref: ab8cc701d08f6547f8dbc1cb8afd6ab982709dfc
      # Run the keymap behavior checks before building.
      preparation_command: python3 tests/check_keymap.py --firmware qmk_firmware

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build
